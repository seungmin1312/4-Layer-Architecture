<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a93"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <style>
      .layer-title { font-size: 22px; font-weight: 700; fill: #1a1a1a; }
      .layer-role  { font-size: 13px; fill: #4a4a4a; }
      .file-name   { font-size: 13px; fill: #1a1a1a; font-family: 'Consolas','Courier New',monospace; }
      .file-desc   { font-size: 11px; fill: #6a6a6a; }
      .arrow-lbl-down { font-size: 12px; fill: #1f3a93; font-weight: 600; }
      .arrow-lbl-up   { font-size: 12px; fill: #c0392b; font-weight: 600; }
      .title       { font-size: 24px; font-weight: 700; fill: #1a1a1a; }
      .subtitle    { font-size: 13px; fill: #555; }
      .legend      { font-size: 12px; fill: #333; }
      .vendor-lbl  { font-size: 13px; fill: #555; font-style: italic; }
    </style>
  </defs>

  <text x="540" y="36" text-anchor="middle" class="title">Layered Firmware Framework - Architecture</text>
  <text x="540" y="58" text-anchor="middle" class="subtitle">4-Layer (APP / DCA / DDI / DRV) | Top-down call only | Reverse path via callback / semaphore</text>

  <rect x="60" y="90" width="960" height="130" rx="8" fill="#fef6e4" stroke="#e8a838" stroke-width="2"/>
  <text x="90" y="120" class="layer-title">APP</text>
  <text x="90" y="140" class="layer-role">Entry points / system scenarios / business logic - ThreadX thread entries</text>
  <rect x="90"  y="155" width="220" height="50" rx="4" fill="#fff" stroke="#d4a017"/>
  <text x="100" y="174" class="file-name">th_acq_entry.c</text>
  <text x="100" y="192" class="file-desc">ADC base sampling (semaphore wait)</text>
  <rect x="320" y="155" width="220" height="50" rx="4" fill="#fff" stroke="#d4a017"/>
  <text x="330" y="174" class="file-name">th_safety_ctrl_entry.c</text>
  <text x="330" y="192" class="file-desc">Control loop (semaphore wait)</text>
  <rect x="550" y="155" width="220" height="50" rx="4" fill="#fff" stroke="#d4a017"/>
  <text x="560" y="174" class="file-name">th_comm_entry.c</text>
  <text x="560" y="192" class="file-desc">RX/TX dispatch (semaphore wait)</text>
  <rect x="780" y="155" width="220" height="50" rx="4" fill="#fff" stroke="#d4a017"/>
  <text x="790" y="174" class="file-name">th_lifecycle_entry.c</text>
  <text x="790" y="192" class="file-desc">System lifecycle FSM</text>

  <rect x="60" y="290" width="960" height="130" rx="8" fill="#eaf4ea" stroke="#4a8a4a" stroke-width="2"/>
  <text x="90" y="320" class="layer-title">DCA</text>
  <text x="90" y="340" class="layer-role">Device Component Abstraction - domain logic / state / policy (mutex-protected, cross-thread safe)</text>
  <rect x="90"  y="355" width="290" height="50" rx="4" fill="#fff" stroke="#4a8a4a"/>
  <text x="100" y="374" class="file-name">dca_serial.c</text>
  <text x="100" y="392" class="file-desc">comm abstraction (comm_io_t vtable)</text>
  <rect x="390" y="355" width="290" height="50" rx="4" fill="#fff" stroke="#4a8a4a"/>
  <text x="400" y="374" class="file-name">dca_adcfilter.c</text>
  <text x="400" y="392" class="file-desc">DMAC done -&gt; filter / control dispatch</text>
  <rect x="690" y="355" width="290" height="50" rx="4" fill="#fff" stroke="#4a8a4a"/>
  <text x="700" y="374" class="file-name">dca_system.c</text>
  <text x="700" y="392" class="file-desc">System info + GPIO event handlers</text>

  <rect x="60" y="490" width="960" height="160" rx="8" fill="#eaf0fb" stroke="#3066be" stroke-width="2"/>
  <text x="90" y="520" class="layer-title">DDI</text>
  <text x="90" y="540" class="layer-role">Device Driver Interface - slot abstraction / multi-instance / RTOS primitive wrappers</text>
  <rect x="90"  y="555" width="130" height="40" rx="4" fill="#fff" stroke="#3066be"/>
  <text x="100" y="580" class="file-name">ddi_uart.c</text>
  <rect x="230" y="555" width="130" height="40" rx="4" fill="#fff" stroke="#3066be"/>
  <text x="240" y="580" class="file-name">ddi_adc.c</text>
  <rect x="370" y="555" width="130" height="40" rx="4" fill="#fff" stroke="#3066be"/>
  <text x="380" y="580" class="file-name">ddi_dmac.c</text>
  <rect x="510" y="555" width="130" height="40" rx="4" fill="#fff" stroke="#3066be"/>
  <text x="520" y="580" class="file-name">ddi_timer.c</text>
  <rect x="650" y="555" width="130" height="40" rx="4" fill="#fff" stroke="#3066be"/>
  <text x="660" y="580" class="file-name">ddi_gpio.c</text>
  <rect x="790" y="555" width="220" height="40" rx="4" fill="#dfe6e6" stroke="#3066be"/>
  <text x="800" y="580" class="file-name">ddi_mutex / ddi_semaphore</text>
  <text x="90"  y="625" class="file-desc">- slot enum -&gt; drv handle map, ms-&gt;tick conversion, single fail-logging point</text>
  <text x="790" y="625" class="file-desc">- TX_MUTEX / TX_SEMAPHORE wrap</text>

  <rect x="60" y="720" width="960" height="130" rx="8" fill="#f9eaea" stroke="#a94442" stroke-width="2"/>
  <text x="90" y="750" class="layer-title">DRV</text>
  <text x="90" y="770" class="layer-role">MCU Dependency - Renesas FSP direct calls, ISR entry (top-half: flag / semaphore set only)</text>
  <rect x="90"  y="785" width="160" height="45" rx="4" fill="#fff" stroke="#a94442"/>
  <text x="100" y="804" class="file-name">drv_uart.c</text>
  <text x="100" y="822" class="file-desc">isr_uart4 -&gt; callback</text>
  <rect x="260" y="785" width="160" height="45" rx="4" fill="#fff" stroke="#a94442"/>
  <text x="270" y="804" class="file-name">drv_adc.c</text>
  <text x="270" y="822" class="file-desc">isr_adc0_trg</text>
  <rect x="430" y="785" width="160" height="45" rx="4" fill="#fff" stroke="#a94442"/>
  <text x="440" y="804" class="file-name">drv_dmac.c</text>
  <text x="440" y="822" class="file-desc">isr_adc_dmac0~3</text>
  <rect x="600" y="785" width="160" height="45" rx="4" fill="#fff" stroke="#a94442"/>
  <text x="610" y="804" class="file-name">drv_timer.c</text>
  <text x="610" y="822" class="file-desc">isr_agt1_adc_trg</text>
  <rect x="770" y="785" width="160" height="45" rx="4" fill="#fff" stroke="#a94442"/>
  <text x="780" y="804" class="file-name">drv_gpio.c</text>
  <text x="780" y="822" class="file-desc">External IRQ</text>
  <rect x="940" y="785" width="70"  height="45" rx="4" fill="#fde6e6" stroke="#a94442"/>
  <text x="950" y="804" class="file-name">drv_rtos.h</text>

  <rect x="280" y="890" width="520" height="40" rx="6" fill="#f0f0f0" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="540" y="915" text-anchor="middle" class="vendor-lbl">Renesas FSP / HAL / SDK  (vendor-supplied)</text>

  <line x1="420" y1="220" x2="420" y2="282" stroke="#1f3a93" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="345" y="258" text-anchor="end" class="arrow-lbl-down">call (top-down)</text>
  <line x1="660" y1="285" x2="660" y2="223" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="735" y="258" class="arrow-lbl-up">callback / sem put</text>

  <line x1="420" y1="420" x2="420" y2="482" stroke="#1f3a93" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="345" y="458" text-anchor="end" class="arrow-lbl-down">call (top-down)</text>
  <line x1="660" y1="485" x2="660" y2="423" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="735" y="458" class="arrow-lbl-up">callback</text>

  <line x1="420" y1="650" x2="420" y2="712" stroke="#1f3a93" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="345" y="688" text-anchor="end" class="arrow-lbl-down">call (top-down)</text>
  <line x1="660" y1="715" x2="660" y2="653" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="735" y="688" class="arrow-lbl-up">ISR callback</text>

  <line x1="540" y1="850" x2="540" y2="887" stroke="#1f3a93" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="555" y="875" class="arrow-lbl-down">FSP API</text>

  <g transform="translate(60, 945)">
    <line x1="0"   y1="0" x2="35"  y2="0" stroke="#1f3a93" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="45"  y="4" class="legend">Top-down call (allowed)</text>
    <line x1="240" y1="0" x2="275" y2="0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
    <text x="285" y="4" class="legend">Reverse: callback / semaphore (no #include upward)</text>
  </g>
</svg>
